<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>研習計畫申請書產生器</title>
<style>
:root{
  --bg:#f5f7f9; --panel:#fff; --line:#dfe5e9; --text:#24313b;
  --muted:#6c7b86; --accent:#2f6d62; --accent-soft:#eaf3f0; --danger:#b94a48;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:var(--bg);color:var(--text)}
header{padding:24px 32px 12px}
header h1{margin:0 0 6px;font-size:26px}
header p{margin:0;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(420px,0.9fr) minmax(520px,1.1fr);gap:24px;padding:18px 32px 110px;align-items:start}
.form-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.section{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.section:first-child{border-top:0;padding-top:0;margin-top:0}
.section h2{font-size:17px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid #cfd8dd;border-radius:10px;padding:10px 11px;font:inherit;background:#fff}
textarea{min-height:86px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #b8d7cf;border-color:var(--accent)}
.field{margin-bottom:12px}
.session{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fbfcfc}
.session-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
button{border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:#eef2f4;color:#334}
.btn-outline{background:#fff;border:1px solid var(--line)}
.btn-danger{background:#fff0ef;color:var(--danger)}
.preview-wrap{position:sticky;top:18px;min-width:0}
.preview-toolbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
.paper-stage{position:relative;width:100%;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
.paper-stage .paper{flex:0 0 210mm;transform-origin:top center}
.paper{
  width:210mm; min-height:297mm; margin:auto; background:#fff; color:#000;
  box-shadow:0 8px 30px rgba(24,38,49,.12); padding:18mm;
  font-family:"Microsoft JhengHei","PMingLiU","Noto Serif TC",serif;
  font-size:10.5pt; line-height:1.55;
}
.paper h1{text-align:center;font-size:15pt;margin:0 0 18px;font-weight:700}
.docline{font-size:10.5pt;line-height:1.55;margin:2px 0}
.docblock{font-size:10.5pt;line-height:1.55;margin:3px 0 6px}
.value{font-family:"Microsoft JhengHei","PMingLiU",sans-serif}
.signatures{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:18px 0;margin-top:36px;page-break-inside:avoid}
.signatures td{width:25%;border-top:1px solid #333;text-align:center;padding-top:6px;font-size:10.5pt;white-space:nowrap}
.cost-card{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:14px;line-height:1.7}
.footer-actions{
 position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);
 border-top:1px solid var(--line);padding:12px 32px;display:flex;justify-content:flex-end;gap:10px;z-index:20
}
.mobile-tabs{display:none}
.modal{position:fixed;inset:0;background:rgba(20,28,32,.66);display:none;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal.show{display:flex}
.modal-inner{width:min(900px,96vw);height:94vh;background:#f2f4f5;border-radius:16px;overflow:auto;padding:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;position:sticky;top:0;background:#f2f4f5;padding:4px 0 10px;z-index:2}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.credit-note{font-size:12px;color:#c62828;line-height:1.55;margin-top:6px}
@media (max-width:900px){
 header{padding:18px 18px 8px}.layout{display:block;padding:12px 16px 100px}
 .mobile-tabs{display:flex;gap:8px;margin:0 16px 6px}
 .preview-wrap{position:static;display:none}.layout.show-preview .form-panel{display:none}.layout.show-preview .preview-wrap{display:block}
 .preview-wrap{overflow:hidden}.paper-stage{overflow:hidden}.paper{min-height:297mm}.grid2{grid-template-columns:1fr}
 .footer-actions{padding:10px 16px}.desktop-only{display:none}
}
@page{size:A4;margin:0}
@media print{
 html,body{margin:0!important;padding:0!important;background:#fff!important}
 .form-panel,header,.preview-toolbar,.footer-actions,.mobile-tabs,.modal,.modal-actions{display:none!important}
 .layout{display:block!important;padding:0!important;margin:0!important}
 .preview-wrap{display:block!important;position:static!important;margin:0!important;padding:0!important}
 .paper-stage{display:block!important;width:auto!important;height:auto!important;overflow:visible!important}
 .paper{transform:none!important;box-shadow:none!important;width:210mm!important;height:297mm!important;min-height:297mm!important;margin:0!important;padding:18mm!important;overflow:hidden!important}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
</head>
<body>
<header>
  <h1>研習計畫申請書產生器</h1>
  <p>請填寫以下研習資料，完成後即可預覽並下載正式申請書。</p>
</header>

<div class="mobile-tabs">
  <button class="btn-primary" onclick="setMobileTab('form')">填寫表單</button>
  <button class="btn-secondary" onclick="setMobileTab('preview')">預覽申請書</button>
</div>

<main class="layout" id="layout">
  <section class="form-panel">
    <div class="section">
      <h2>基本資料</h2>
      <div class="grid2">
        <div class="field"><label>申請日</label><input id="applyDate" type="date"></div>
        <div class="field"><label>研習申請區域</label><select id="region"><option value="" selected disabled>請選擇</option><option>北區</option><option>中區</option><option>南區</option><option>全區</option></select></div>
      </div>
      <div class="field"><label>研習類別</label><select id="type"><option value="" selected disabled>請選擇</option><option value="實體">實體</option><option value="線上">線上</option></select></div>
      <div class="grid2">
        <div class="field"><label>研習時數</label><input id="hours" placeholder="例如：6 小時"></div>
        <div class="field"><label>是否需要申請教師研習時數</label><select id="teacherCredit"><option value="" selected disabled>請選擇</option><option value="否">否</option><option value="是">是</option></select><div class="credit-note">（有製作公文、發送等流程，不一定能配合。如有特定合作學校，請與之聯繫，或有其他狀況，請與行企討論。）</div></div>
      </div>
      <div class="field"><label>研習主題</label><input id="topic" placeholder="例如：新制本土語文競賽、讀者劇場"></div>
    </div>

    <div class="section">
      <h2>講師資料</h2>
      <div class="field"><label>講師姓名</label><input id="teacher" placeholder="例如：張○○老師"></div>
      <div class="grid2">
        <div class="field"><label>手機</label><input id="phone" placeholder="09xx-xxx-xxx"></div>
        <div class="field"><label>Email</label><input id="email" type="email" placeholder="teacher@example.com"></div>
      </div>
    </div>

    <div class="section">
      <h2>研習場次</h2>
      <div id="sessions"></div>
      <button class="btn-outline" onclick="addSession()">＋ 新增場次</button>
    </div>

    <div class="section">
      <h2>費用資料</h2>
      <div class="grid2">
        <div class="field"><label>講師時數</label><input id="lectureHours" type="number" min="0" step="0.5" value=""></div>
        <div class="field"><label>每小時講師費</label><input id="hourlyRate" type="number" min="0" value=""></div>
      </div>
      <div class="grid2">
        <div class="field"><label>場地費</label><input id="otherCost" type="number" min="0" value=""></div>
        <div class="field"><label>雜支費用</label><input id="miscCost" type="number" min="0" value=""></div>
      </div>
      <div class="cost-card" id="costSummary"></div>
      <div class="field" style="margin-top:12px"><label>費用說明（可手動修改）</label><textarea id="costDesc"></textarea></div>
    </div>

    <div class="section">
      <h2>行政資料</h2>
      <div class="field"><label>研習性質</label><select id="nature"><option value="" selected disabled>請選擇</option><option value="教科書">教科書</option><option value="本土語">本土語</option><option value="其他">其他</option></select></div>
      <div class="grid2">
        <div class="field"><label>單位名稱</label><select id="unit"><option value="" selected disabled>請選擇</option><option value="真平企業有限公司">真平企業有限公司</option><option value="台灣海翁台語文教育協會">台灣海翁台語文教育協會</option><option value="中華國民教育推廣協會">中華國民教育推廣協會</option></select></div>
        <div class="field"><label>統一編號</label><select id="taxId"><option value="" selected disabled>請選擇</option><option value="16578128">16578128</option><option value="98668479">98668479</option><option value="47851121">47851121</option></select></div>
      </div>
      <div class="grid2">
        <div class="field"><label>是否需要海報</label><select id="poster"><option value="" selected disabled>請選擇</option><option>否</option><option>是</option></select></div>
        <div class="field"><label>是否需要指示牌</label><select id="sign"><option value="" selected disabled>請選擇</option><option>否</option><option>是</option></select></div>
      </div>
      <div class="field"><label>其他</label><textarea id="other" placeholder="例：請公司支援人力、影印講義...等，若無需求，免填。"></textarea></div>
    </div>
  </section>

  <section class="preview-wrap">
    <div class="preview-toolbar desktop-only">
      <button class="btn-outline" onclick="openFullPreview()">完整預覽</button>
    </div>
    <div class="paper-stage" id="paperStage"><article class="paper" id="paper"></article></div>
  </section>
</main>

<div class="footer-actions">
  <button class="btn-outline" onclick="openFullPreview()">預覽正式文件</button>
  <button class="btn-outline" onclick="printDocument()">列印</button>
  <button class="btn-secondary" onclick="downloadWord()">下載 Word</button>
  <button class="btn-primary" onclick="downloadPDF()">下載 PDF</button>
</div>

<div class="modal" id="modal">
  <div class="modal-inner">
    <div class="modal-actions"><strong style="margin-right:auto;padding:10px 4px">正式文件完整預覽</strong>
      <button class="btn-outline" onclick="closePreview()">返回修改</button>
      <button class="btn-outline" onclick="printDocument()">列印</button>
      <button class="btn-secondary" onclick="downloadWord()">下載 Word</button>
      <button class="btn-primary" onclick="downloadPDF()">下載 PDF</button>
    </div>
    <div class="paper-stage" id="modalPaperStage"><article class="paper" id="modalPaper"></article></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmtMoney = n => Number(n||0).toLocaleString('zh-TW');
const fmtDate = d => d ? d.replaceAll('-','/') : '';
const shortDate = d => { if(!d) return ''; const [y,m,day]=d.split('-'); return `${Number(m)}/${Number(day)}`; };

let sessionData = [
  {date:'', start:'', end:'', place:'', people:''}
];

function addSession(data={date:'',start:'',end:'',place:'',people:''}){
  sessionData.push(data); renderSessions(); update();
}
function removeSession(i){ if(sessionData.length>1){sessionData.splice(i,1);renderSessions();update();} }
function renderSessions(){
  const box=$('sessions'); box.innerHTML='';
  sessionData.forEach((s,i)=>{
    const el=document.createElement('div'); el.className='session';
    el.innerHTML=`
      <div class="session-head"><span>場次 ${i+1}</span>${sessionData.length>1?`<button class="btn-danger" onclick="removeSession(${i})">移除</button>`:''}</div>
      <div class="grid2">
        <div class="field"><label>辦理日期</label><input type="date" value="${s.date||''}" oninput="setSession(${i},'date',this.value)"></div>
        <div class="field"><label>人數限制</label><input type="number" min="0" value="${s.people||''}" oninput="setSession(${i},'people',this.value)"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>開始時間</label><input type="time" value="${s.start||''}" oninput="setSession(${i},'start',this.value)"></div>
        <div class="field"><label>結束時間</label><input type="time" value="${s.end||''}" oninput="setSession(${i},'end',this.value)"></div>
      </div>
      <div class="field"><label>辦理地點</label><input value="${esc(s.place||'')}" oninput="setSession(${i},'place',this.value)"></div>
    `;
    box.appendChild(el);
  })
}
function setSession(i,k,v){ sessionData[i][k]=v; update(); }

function minutesBetween(start,end){
  if(!start||!end) return null;
  const [sh,sm]=start.split(':').map(Number), [eh,em]=end.split(':').map(Number);
  return (eh*60+em)-(sh*60+sm);
}
function getData(){
  const totalPeople=sessionData.reduce((a,s)=>a+Number(s.people||0),0);
  const samePeople=sessionData.length && sessionData.every(s=>Number(s.people||0)===Number(sessionData[0].people||0));
  const sameTime=sessionData.length && sessionData.every(s=>s.start===sessionData[0].start && s.end===sessionData[0].end);
  const dur = sessionData[0] ? minutesBetween(sessionData[0].start,sessionData[0].end) : null;
  const lectureFee=Number($('lectureHours').value||0)*Number($('hourlyRate').value||0)*sessionData.length;
  const total=lectureFee+Number($('otherCost').value||0)+Number($('miscCost').value||0);
  return {
    applyDate:$('applyDate').value, region:$('region').value, type:$('type').value, hours:$('hours').value, topic:$('topic').value,
    teacher:$('teacher').value, phone:$('phone').value, email:$('email').value, teacherCredit:$('teacherCredit').value, nature:$('nature').value,
    unit:$('unit').value, taxId:$('taxId').value, poster:$('poster').value, sign:$('sign').value,
    miscCost:Number($('miscCost').value||0), costDesc:$('costDesc').value, other:$('other').value,
    dates:sessionData.map(s=>fmtDate(s.date)).filter(Boolean).join('、'),
    times:sameTime && sessionData[0] ? `${sessionData[0].start}～${sessionData[0].end}${dur>0?`，每場 ${dur/60} 小時`:''}` : sessionData.map(s=>`${shortDate(s.date)} ${s.start}～${s.end}`).join('、'),
    places:sessionData.map(s=>`${shortDate(s.date)} ${s.place}`).filter(x=>x.trim()).join('、'),
    people:(samePeople && sessionData[0]) ? `每場 ${sessionData[0].people||0} 人，共 ${totalPeople} 人次` : `共 ${totalPeople} 人次`,
    lectureFee,total
  }
}
function blank(v){return v?esc(v):'＿＿＿＿'}
function docHTML(){
  const d=getData();
  const teacher=[d.teacher,d.phone,d.email].filter(Boolean).join('／');
  const nature = [d.nature, d.unit?`單位：${d.unit}`:'', d.taxId?`統編：${d.taxId}`:''].filter(Boolean).join('<br>');
  const posterSign=`海報：${d.poster||'＿＿＿＿'}；指示牌：${d.sign||'＿＿＿＿'}`;
  return `
    <h1>金安文教機構研習計畫申請書</h1>
    <div class="docline">▼申請日：<span class="value">${blank(fmtDate(d.applyDate))}</span></div>
    <div class="docline">一、研習申請區域：<span class="value">${blank(d.region)}</span></div>
    <div class="docline">二、研習類別：<span class="value">${blank(d.type)}</span></div>
    <div class="docline">三、研習時數：<span class="value">${blank(d.hours)}</span>&nbsp;&nbsp;　是否需要申請教師研習時數：<span class="value">${blank(d.teacherCredit)}</span></div>
    <div class="docline">四、研習主題：<span class="value">${blank(d.topic)}</span></div>
    <div class="docline">五、講師／手機／電郵：<span class="value">${blank(teacher)}</span></div>
    <div class="docline">六、辦理日期：<span class="value">${blank(d.dates)}</span></div>
    <div class="docline">七、辦理時間：<span class="value">${blank(d.times)}</span></div>
    <div class="docline">八、辦理地點：<span class="value">${blank(d.places)}</span></div>
    <div class="docline">九、人數限制：<span class="value">${blank(d.people)}</span></div>
    <div class="docblock">十、研習性質：<br><span class="value">${nature||'＿＿＿＿＿＿＿＿＿＿＿＿＿＿'}</span></div>
    <div class="docline">十一、海報、指示牌：<span class="value">${esc(posterSign)}</span></div>
    <div class="docline">十二、雜支費用：<span class="value">${d.miscCost?fmtMoney(d.miscCost)+' 元':'＿＿＿＿'}</span></div>
    <div class="docblock">十三、費用說明：<br><span class="value">${d.costDesc?esc(d.costDesc).replaceAll('\n','<br>'):'＿＿＿＿＿＿＿＿＿＿＿＿＿＿'}</span></div>
    <div class="docblock">十四、其他：${d.other?`<br><span class="value">${esc(d.other).replaceAll('\n','<br>')}</span>`:''}</div>
    <div class="docline">十五、研習完畢請檢附簽到簿、活動照片及相關文件以利核銷。</div>
    <div class="docline">十六、本計畫經主管核可後實施，修正時亦同。</div>
    <table class="signatures" role="presentation" cellspacing="0" cellpadding="0">
      <tr><td>申請人</td><td>單位主管</td><td>副總</td><td>總經理</td></tr>
    </table>`;
}
function updateCostTextIfAuto(){
  if($('costDesc').dataset.manual==='1') return;
  const hasCostInput = ['lectureHours','hourlyRate','otherCost','miscCost'].some(id => $(id).value !== '');
  if(!hasCostInput){
    $('costDesc').value='';
    return;
  }
  const d=getData();
  const lh=Number($('lectureHours').value||0), rate=Number($('hourlyRate').value||0), other=Number($('otherCost').value||0), misc=Number($('miscCost').value||0);
  $('costDesc').value=`講師費：${lh} 小時 × ${fmtMoney(rate)} 元 × ${sessionData.length} 場 = ${fmtMoney(d.lectureFee)} 元
場地費：${fmtMoney(other)} 元
雜支費用：${fmtMoney(misc)} 元
總費用：${fmtMoney(d.total)} 元`;
}
function fitPaperToStage(paperId, stageId){
  const paper = $(paperId), stage = $(stageId);
  if(!paper || !stage) return;
  // Keep the document at true A4 size, then scale only the on-screen preview
  // so phones, tablets, laptops and rotated screens always show the full page width.
  paper.style.transform = 'none';
  const naturalWidth = paper.offsetWidth || 794;
  const naturalHeight = paper.offsetHeight || 1123;
  const availableWidth = Math.max(1, stage.clientWidth - 4);
  const scale = Math.min(1, availableWidth / naturalWidth);
  paper.style.transform = `scale(${scale})`;
  stage.style.height = `${Math.ceil(naturalHeight * scale)}px`;
}
function fitAllPreviews(){
  requestAnimationFrame(()=>{
    fitPaperToStage('paper','paperStage');
    if($('modal').classList.contains('show')) fitPaperToStage('modalPaper','modalPaperStage');
  });
}
function update(){
  const d=getData();
  const hasCostInput = ['lectureHours','hourlyRate','otherCost','miscCost'].some(id => $(id).value !== '');
  $('costSummary').innerHTML = hasCostInput
    ? `講師費：${$('lectureHours').value||0} 小時 × ${fmtMoney($('hourlyRate').value||0)} 元 × ${sessionData.length} 場 ＝ <b>${fmtMoney(d.lectureFee)} 元</b><br>總費用：<b>${fmtMoney(d.total)} 元</b>`
    : '尚未填寫費用資料';
  updateCostTextIfAuto();
  $('paper').innerHTML=docHTML();
  $('modalPaper').innerHTML=docHTML();
  fitAllPreviews();
}
function openFullPreview(){
  update();
  $('modal').classList.add('show');
  document.body.style.overflow='hidden';
  requestAnimationFrame(()=>fitPaperToStage('modalPaper','modalPaperStage'));
}
function closePreview(){
  $('modal').classList.remove('show');
  document.body.style.overflow='';
}
$('modal').addEventListener('click', (e)=>{ if(e.target===$('modal')) closePreview(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && $('modal').classList.contains('show')) closePreview(); });
function setMobileTab(t){ $('layout').classList.toggle('show-preview', t==='preview'); if(t==='preview') requestAnimationFrame(fitAllPreviews); }
window.addEventListener('resize', fitAllPreviews);
window.addEventListener('orientationchange', ()=>setTimeout(fitAllPreviews, 120));
function filename(ext){
  const d=getData(); const topic=(d.topic||'未命名').replace(/[\\/:*?"<>|]/g,'_').slice(0,30);
  const date=(sessionData[0]?.date||d.applyDate||'').replaceAll('/','-');
  return `研習計畫申請書_${topic}_${date||'未填日期'}.${ext}`;
}

async function downloadPDF(){
  update();
  const source = $('paper');

  // Export the exact same A4 layout used by preview/print/Word.
  const clone = source.cloneNode(true);
  clone.style.boxShadow = 'none';
  clone.style.margin = '0';
  clone.style.width = '210mm';
  clone.style.minHeight = '297mm';
  clone.style.padding = '18mm';
  clone.style.fontFamily = '"Microsoft JhengHei","PMingLiU","Noto Serif TC",serif';
  clone.style.fontSize = '10.5pt';
  clone.style.lineHeight = '1.55';
  clone.style.height = '297mm';
  clone.style.overflow = 'hidden';
  clone.style.background = '#fff';

  const wrapper = document.createElement('div');
  wrapper.style.position = 'fixed';
  wrapper.style.left = '-100000px';
  wrapper.style.top = '0';
  wrapper.style.width = '210mm';
  wrapper.style.margin = '0';
  wrapper.style.padding = '0';
  wrapper.style.background = '#fff';
  wrapper.appendChild(clone);
  document.body.appendChild(wrapper);

  try {
    // Wait until browser fonts are ready before taking the canvas snapshot.
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }

    const opt = {
      margin: 0,
      filename: filename('pdf'),
      image: { type: 'jpeg', quality: 1 },
      html2canvas: {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff',
        scrollX: 0,
        scrollY: 0
      },
      jsPDF: {
        unit: 'mm',
        format: 'a4',
        orientation: 'portrait'
      },
      pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
    };

    await html2pdf().set(opt).from(clone).save();
  } catch (err) {
    console.error(err);
    alert('PDF 產生失敗，請重新整理頁面後再試一次。');
  } finally {
    document.body.removeChild(wrapper);
  }
}

function printDocument(){
  update();
  window.print();
}

async function downloadWord(){
  // 產生真正的 .docx，而不是把 HTML 偽裝成 .doc。
  // 版面數值與預覽 / 列印 / PDF 採同一基準：A4、18mm 邊界、10.5pt、1.55 行距。
  if (typeof docx === 'undefined') {
    alert('Word 元件載入失敗，請確認網路連線後重新整理頁面。');
    return;
  }

  const d = getData();
  const teacher = [d.teacher,d.phone,d.email].filter(Boolean).join('／') || '＿＿＿＿';
  const lines = [];
  const addLine = (text, opts={}) => lines.push(new docx.Paragraph({
    children:[new docx.TextRun({text, font:'Microsoft JhengHei', size:21, bold:!!opts.bold})],
    spacing:{before:0, after:40, line:326},
    keepNext:!!opts.keepNext
  }));
  const addBlank = (text='＿＿＿＿＿＿＿＿＿＿＿＿＿＿') => addLine(text);

  addLine(`▼申請日：${fmtDate(d.applyDate) || '＿＿＿＿'}`);
  addLine(`一、研習申請區域：${d.region || '＿＿＿＿'}`);
  addLine(`二、研習類別：${d.type || '＿＿＿＿'}`);
  addLine(`三、研習時數：${d.hours || '＿＿＿＿'}　　是否需要申請教師研習時數：${d.teacherCredit || '＿＿＿＿'}`);
  addLine(`四、研習主題：${d.topic || '＿＿＿＿'}`);
  addLine(`五、講師／手機／電郵：${teacher}`);
  addLine(`六、辦理日期：${d.dates || '＿＿＿＿'}`);
  addLine(`七、辦理時間：${d.times || '＿＿＿＿'}`);
  addLine(`八、辦理地點：${d.places || '＿＿＿＿'}`);
  addLine(`九、人數限制：${d.people || '＿＿＿＿'}`);
  addLine('十、研習性質：', {keepNext:true});
  if(d.nature) addLine(d.nature); else addBlank();
  if(d.unit) addLine(`單位：${d.unit}`);
  if(d.taxId) addLine(`統編：${d.taxId}`);
  addLine(`十一、海報、指示牌：海報：${d.poster || '＿＿＿＿'}；指示牌：${d.sign || '＿＿＿＿'}`);
  addLine(`十二、雜支費用：${d.miscCost ? fmtMoney(d.miscCost)+' 元' : '＿＿＿＿'}`);
  addLine('十三、費用說明：', {keepNext:true});
  if(d.costDesc){
    d.costDesc.split(/\r?\n/).forEach(t=>addLine(t));
  }else addBlank();
  addLine('十四、其他：', {keepNext:!!d.other});
  if(d.other){ d.other.split(/\r?\n/).forEach(t=>addLine(t)); }
  addLine('十五、研習完畢請檢附簽到簿、活動照片及相關文件以利核銷。');
  addLine('十六、本計畫經主管核可後實施，修正時亦同。');

  const signCell = (label) => new docx.TableCell({
    width:{size:22.75,type:docx.WidthType.PERCENTAGE},
    borders:{
      top:{style:docx.BorderStyle.SINGLE,size:4,color:'333333'},
      bottom:{style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'},
      left:{style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'},
      right:{style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'},
      insideHorizontal:{style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'},
      insideVertical:{style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'}
    },
    margins:{top:100,bottom:0,left:60,right:60},
    children:[new docx.Paragraph({
      alignment:docx.AlignmentType.CENTER,
      spacing:{before:0,after:0,line:326},
      children:[new docx.TextRun({text:label,font:'Microsoft JhengHei',size:21})]
    })]
  });

  const spacerCell = () => new docx.TableCell({
    width:{size:3,type:docx.WidthType.PERCENTAGE},
    borders:{
      top:{style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'},
      bottom:{style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'},
      left:{style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'},
      right:{style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'}
    },
    children:[new docx.Paragraph({children:[]})]
  });

  const signTable = new docx.Table({
    width:{size:100,type:docx.WidthType.PERCENTAGE},
    layout:docx.TableLayoutType.FIXED,
    borders:{
      top:{style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'},
      bottom:{style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'},
      left:{style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'},
      right:{style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'},
      insideHorizontal:{style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'},
      insideVertical:{style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'}
    },
    rows:[new docx.TableRow({
      cantSplit:true,
      children:[signCell('申請人'),spacerCell(),signCell('單位主管'),spacerCell(),signCell('副總'),spacerCell(),signCell('總經理')]
    })]
  });

  const title = new docx.Paragraph({
    alignment:docx.AlignmentType.CENTER,
    spacing:{before:0,after:240,line:326},
    children:[new docx.TextRun({text:'金安文教機構研習計畫申請書',font:'Microsoft JhengHei',size:30,bold:true})]
  });

  const doc = new docx.Document({
    styles:{
      default:{document:{run:{font:'Microsoft JhengHei',size:21},paragraph:{spacing:{line:326}}}}
    },
    sections:[{
      properties:{
        page:{
          size:{width:11906,height:16838},
          margin:{top:1021,right:1021,bottom:1021,left:1021}
        }
      },
      children:[title, ...lines,
        new docx.Paragraph({spacing:{before:260,after:0},children:[]}),
        signTable
      ]
    }]
  });

  try{
    const blob = await docx.Packer.toBlob(doc);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=filename('docx');
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }catch(err){
    console.error(err);
    alert('Word 產生失敗，請重新整理頁面後再試一次。');
  }
}
document.querySelectorAll('input,select,textarea').forEach(el=>{
  el.addEventListener('input',()=>{ if(el.id==='costDesc') el.dataset.manual='1'; update(); });
  el.addEventListener('change',update);
});
renderSessions(); update();
</script>
